# Shared checks run untrusted PR code with a read-only token and no secrets.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: Baseline
    uses: jmusick/ci/.github/workflows/baseline.yml@8f28b7a6deeacce2fbc35539d56f810ba64656c2 # v0.2.3

  web-app:
    name: Web app
    uses: jmusick/ci/.github/workflows/web-app.yml@8f28b7a6deeacce2fbc35539d56f810ba64656c2 # v0.2.3
    with:
      lint-command: npm run lint
      test-command: npm test
      build-command: npm run build
      a11y-command: npm run test:a11y
      a11y-setup-command: |
        printf 'JWT_SECRET=%s\nSUPER_ADMIN_EMAIL=admin@example.test\n' "$(openssl rand -hex 32)" > .dev.vars
        npm run setup:db
      a11y-server-command: npx wrangler pages dev dist --local --ip 127.0.0.1 --port 5000
      a11y-url: http://127.0.0.1:5000
      a11y-ready-url: http://127.0.0.1:5000/api/health

  # Require this check in branch protection; it fails unless both shared workflows pass.
  gate:
    name: CI gate
    if: always()
    needs: [baseline, web-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed."
              exit 1
            fi
          done
